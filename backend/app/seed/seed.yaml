routes:
  - task: easy
    label: Trả lời khách, tóm tắt, dịch, hỏi đáp ngắn
    primary_model: claude-haiku
    fallback_model: gpt-luna
    sort: 10
  - task: vision
    label: Đọc ảnh hoá đơn, phiếu nhập, ảnh chụp
    primary_model: gemini-flash
    fallback_model: claude-haiku
    sort: 20
  - task: writing
    label: Bài fanpage, kịch bản TikTok, caption
    primary_model: claude-sonnet
    fallback_model: gpt-sol
    sort: 30
  - task: hard
    label: Hợp đồng, phân tích dài, viết code
    primary_model: claude-opus
    fallback_model: gpt-sol
    sort: 40

branches:
  - name: Lê Văn Lương
    address: 68 Lê Văn Lương
    keywords: lê văn lương, le van luong, lvl
    monthly_limit_vnd: 1500000
  - name: Phạm Văn Đồng
    keywords: phạm văn đồng, pham van dong, pvd
    monthly_limit_vnd: 1500000

prompts:
  - scope: chat
    title: Trả lời khách hỏi giá thay lốp
    text: "Khách hỏi giá thay lốp. Hãy soạn tin trả lời lịch sự theo mẫu Thi Lốp: chào khách, nêu các lựa chọn lốp phù hợp (để trống giá dạng [GIÁ] nếu chưa có), dịch vụ đi kèm, mời đặt lịch. Thông tin khách: "
    sort: 10
  - scope: chat
    title: Soạn tin nhắc bảo dưỡng định kỳ
    text: "Soạn tin nhắn ngắn (dưới 60 chữ) nhắc khách đã tới lịch bảo dưỡng định kỳ, mời đặt lịch tại cơ sở Thi Lốp gần nhất. Thông tin khách: "
    sort: 20
  - scope: chat
    title: Giải thích keo chống đinh cho khách
    text: "Giải thích ngắn gọn, dễ hiểu cho khách: keo chống đinh hoạt động thế nào, lợi ích, lưu ý khi dùng. Giọng thân thiện, không hứa quá mức."
    sort: 30
  - scope: chat
    title: Tóm tắt phản hồi khách
    text: "Tóm tắt các phản hồi khách dưới đây thành: điểm khen, điểm chê, việc cần làm ngay. Phản hồi: "
    sort: 40
