# Dữ liệu khởi tạo lần đầu. Sau khi cài, sửa trong trang Quản trị (không cần sửa file này).
# Giá: VND cho 1 triệu token, quy đổi 26.000đ/$ từ bảng giá chính thức các hãng, kiểm tra ngày 22/10/2026.
# Hãng đổi giá thì sửa lại trong Quản trị › Model.

